<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OmnistraPDF</title>
<style>
/* Дизайн — по системе Omnistra: светлая бумага, действия цветом мастики, значки только в меню. */
@font-face { font-family: 'Onest'; font-style: normal; font-weight: 400 800; src: url('onest-cyrillic.woff2') format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Onest'; font-style: normal; font-weight: 400 800; src: url('onest-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  color-scheme: light;
  --paper: #ffffff; --ground: #f6f5fa; --side: #f3f1fa; --soft: #faf9fd;
  --line: #e7e5ef; --line-2: #efedf5; --line-3: #d3d0de; --line-field: #8f8b9f;
  --text: #1d1b2a; --text-2: #4b4859; --text-3: #6b6879;
  --brand: #4a3db8; --brand-hover: #3b2f9c; --brand-soft: #efedfb; --brand-current: #e7e3fb;
  --brand-wash: rgba(74, 61, 184, .06);
  --ok: #1d6a3c; --ok-soft: #e5f4ea;
  --sdo: #8a4b00; --sdo-dot: #d98b00; --sdo-soft: #fdf0d9;
  --red: #c8102e; --red-soft: #fcebee;
  --info: #1f5f9e; --info-soft: #e8f1fb;
  --focus-ring: 0 0 0 1px var(--brand), 0 0 0 4px rgba(74, 61, 184, .14);
  --shadow-window: 0 24px 64px -16px rgba(29, 27, 42, .4);
  --overlay: rgba(29, 27, 42, .45);
  --font: 'Onest', system-ui, 'Segoe UI', sans-serif;
  --r-zone: 16px; --r-panel: 12px; --r: 9px; --r-in: 7px;
  --ease-out: cubic-bezier(.16, 1, .3, 1); --dur-1: .12s; --dur-2: .2s; --dur-3: .3s;
  --fs-label: 12.5px; --fs-section: 13px; --fs-small: 13.5px; --fs-control: 14.5px; --fs-body: 15px; --fs-headline: 20px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 400 var(--fs-body)/1.5 var(--font); color: var(--text); background: var(--ground);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }

/* ---------- меню ---------- */
.side { display: flex; flex-direction: column; gap: var(--sp-2); padding: 18px 14px; background: var(--side);
  border-right: 1px solid var(--line); overflow-y: auto; }
.side > * { flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px var(--sp-2); font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
.brand svg { width: 28px; height: 28px; flex: none; }
.sec { padding: var(--sp-3) 10px var(--sp-1); font-size: var(--fs-section); font-weight: 700; letter-spacing: .02em; color: var(--text-2); }
.menu { display: grid; gap: 2px; }
.menu button { display: flex; align-items: center; gap: 11px; min-height: 38px; padding: 0 10px; border: 0; border-radius: var(--r);
  background: none; color: var(--text-2); font-weight: 500; font-size: var(--fs-control); text-align: left; cursor: pointer;
  transition: background-color var(--dur-1) ease-out, color var(--dur-1) ease-out, opacity var(--dur-2) ease-out; }
.menu button:hover { background: var(--brand-wash); color: var(--text); }
.menu button.on { background: var(--brand-current); color: var(--brand); font-weight: 650; }
.menu button.danger { color: var(--red); }
.menu button.danger:hover { background: var(--red-soft); }
.menu button:disabled { opacity: .45; cursor: not-allowed; background: none; }
.menu .key { margin-left: auto; font-size: var(--fs-label); font-weight: 500; color: var(--text-3); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.side-foot { margin-top: auto; display: grid; gap: 6px; padding-top: var(--sp-4); }
.hint, .ver { padding: 0 10px; font-size: var(--fs-label); color: var(--text-3); line-height: 1.45; }
.hint { margin-bottom: 6px; }
.cnt { margin-left: auto; height: 20px; padding: 0 7px; border-radius: 999px; display: inline-grid; place-items: center;
  font-size: var(--fs-label); font-weight: 700; background: rgba(74, 61, 184, .1); color: var(--brand); }

/* ---------- шапка ---------- */
.main { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; min-height: 0; }
.head { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-4); align-items: center; padding: 18px 26px 16px;
  background: var(--paper); border-bottom: 1px solid var(--line); }
.head h1 { font-size: var(--fs-headline); font-weight: 700; line-height: 1.2; letter-spacing: -.015em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { display: flex; align-items: center; gap: 10px; min-height: 24px; margin-top: 2px; font-size: var(--fs-small); color: var(--text-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: var(--fs-label); font-weight: 600; background: var(--sdo-soft); color: var(--sdo); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sdo-dot); }
.acts { display: flex; align-items: center; gap: var(--sp-2); }
.busy { display: none; align-items: center; gap: 10px; margin-right: var(--sp-2); font-size: var(--fs-small); color: var(--text-2); }
.is-busy .busy { display: inline-flex; }
.is-busy .side, .is-busy .acts .btn, .is-busy .thumbs, .is-busy .stage, .is-busy .top { pointer-events: none; }

/* ---------- кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px;
  border: 1px solid var(--line-3); border-radius: var(--r); background: var(--paper); color: var(--text);
  font: 600 var(--fs-control)/1.15 var(--font); cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur-1) ease-out, border-color var(--dur-1) ease-out, color var(--dur-1) ease-out, opacity var(--dur-2) ease-out, transform var(--dur-1) ease-out; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--paper); }
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: var(--paper); }
.btn-danger { color: var(--red); }
.btn-danger:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: var(--fs-small); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn:disabled:hover { border-color: var(--line-3); color: var(--text); }
.btn-primary:disabled:hover { background: var(--brand); border-color: var(--brand); color: var(--paper); }

/* ---------- сообщения и полоса обрезки ---------- */
.top:empty { display: none; }
.top { display: grid; gap: var(--sp-3); padding: var(--sp-4) 26px 0; }
.alert { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-4); padding: 12px 16px;
  border-radius: var(--r-panel); font-size: var(--fs-control); background: var(--info-soft); color: var(--info);
  animation: alert-in var(--dur-3) var(--ease-out); user-select: text; }
.alert > span { flex: 1; white-space: pre-line; max-height: 30vh; overflow-y: auto; }
.alert .btn { margin: -6px 0; }
.alert-success { background: var(--ok-soft); color: var(--ok); }
.alert-danger { background: var(--red-soft); color: var(--red); }
.alert-warning { background: var(--sdo-soft); color: var(--sdo); }
.alert .x { flex: none; width: 28px; height: 28px; margin: -4px -8px -4px 0; border: 0; border-radius: var(--r-in);
  background: none; color: inherit; font-size: 20px; line-height: 1; cursor: pointer; opacity: .7; }
.alert .x:hover { opacity: 1; background: rgba(29, 27, 42, .06); }
.cropbar { display: flex; align-items: center; gap: var(--sp-2); padding: 12px 12px 12px 18px; border-radius: var(--r-panel);
  background: var(--paper); box-shadow: 0 0 0 1px var(--line); animation: alert-in var(--dur-3) var(--ease-out); }
.cropbar .txt { flex: 1; min-width: 0; font-size: var(--fs-control); font-weight: 600; }
.cropbar .dim { margin-left: var(--sp-2); font-weight: 400; color: var(--text-3); }

/* ---------- страницы ---------- */
.work { grid-row: 3; display: grid; grid-template-columns: 200px 1fr; min-height: 0; }  /* третья строка и без сообщений */
.work.nodoc { grid-template-columns: 1fr; }
.work.nodoc .thumbs { display: none; }
.thumbs { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-1); min-height: 0; overflow-y: auto;
  padding: var(--sp-4) 12px var(--sp-6); border-right: 1px solid var(--line); scrollbar-width: thin; }
.th { display: grid; justify-items: center; gap: 6px; padding: 10px 8px 8px; border: 0; border-radius: var(--r-panel);
  background: none; cursor: pointer; transition: background-color var(--dur-1) ease-out; }
.th:hover { background: var(--brand-wash); }
.th .pg { display: grid; place-items: center; width: 140px; height: 180px; }
.th img { display: block; background: var(--paper); box-shadow: 0 0 0 1px var(--line); border-radius: 2px;
  transition: box-shadow var(--dur-1) ease-out; }
.th .n { min-width: 26px; height: 22px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center;
  font-size: var(--fs-label); font-weight: 600; color: var(--text-3); transition: background-color var(--dur-1) ease-out, color var(--dur-1) ease-out; }
.th.sel img { box-shadow: 0 0 0 2px var(--brand); }
.th.sel .n { background: var(--brand-current); color: var(--brand); }
.th.cur .n { background: var(--brand); color: var(--paper); }

.stage { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; padding: 24px; overflow: hidden; }
.page { position: relative; background: var(--paper); box-shadow: 0 0 0 1px var(--line); }
.page img { display: block; width: 100%; height: 100%; }
.page.cropping { cursor: crosshair; touch-action: none; }
/* затемнение вокруг рамки обрезает .stage (overflow: hidden), а не страница — иначе у края срезались бы ручки */
.crop { position: absolute; border: 2px solid var(--brand); box-shadow: 0 0 0 9999px rgba(29, 27, 42, .45); cursor: move; }
.crop i { position: absolute; width: 14px; height: 14px; background: var(--paper); border: 2px solid var(--brand); border-radius: 4px; }
.crop i[data-h=nw] { left: -8px; top: -8px; cursor: nwse-resize; }
.crop i[data-h=n]  { left: calc(50% - 7px); top: -8px; cursor: ns-resize; }
.crop i[data-h=ne] { right: -8px; top: -8px; cursor: nesw-resize; }
.crop i[data-h=e]  { right: -8px; top: calc(50% - 7px); cursor: ew-resize; }
.crop i[data-h=se] { right: -8px; bottom: -8px; cursor: nwse-resize; }
.crop i[data-h=s]  { left: calc(50% - 7px); bottom: -8px; cursor: ns-resize; }
.crop i[data-h=sw] { left: -8px; bottom: -8px; cursor: nesw-resize; }
.crop i[data-h=w]  { left: -8px; top: calc(50% - 7px); cursor: ew-resize; }

.empty { width: 100%; max-width: 560px; padding: 22px 26px 24px; border-radius: var(--r-zone); background: var(--paper);
  box-shadow: 0 0 0 1px var(--line); animation: alert-in var(--dur-3) var(--ease-out); }
.empty h2 { font-size: var(--fs-headline); font-weight: 700; line-height: 1.2; letter-spacing: -.015em; margin-bottom: var(--sp-2); }
.empty p { color: var(--text-2); margin-bottom: var(--sp-6); }
.empty .acts { flex-wrap: wrap; }

/* ---------- окна ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: var(--overlay);
  animation: fade var(--dur-2) ease-out; }
.modal { width: 100%; max-width: 560px; padding: 22px 26px 24px; border-radius: var(--r-zone); background: var(--paper);
  box-shadow: var(--shadow-window); animation: pop var(--dur-3) var(--ease-out); }
.modal h3 { margin-bottom: var(--sp-4); font-size: var(--fs-headline); font-weight: 700; line-height: 1.2; letter-spacing: -.015em; }
.modal p { color: var(--text-2); white-space: pre-line; }
.modal label { display: block; margin-bottom: var(--sp-1); font-size: var(--fs-small); color: var(--text-2); }
.modal input { width: 100%; height: 40px; padding: 8px 12px; border: 1px solid var(--line-field); border-radius: var(--r);
  font: inherit; color: var(--text); background: var(--paper); user-select: text; }
.modal input:focus { outline: none; border-color: var(--brand); box-shadow: var(--focus-ring); }
.modal small { display: block; margin-top: var(--sp-1); font-size: var(--fs-label); color: var(--text-3); }
.modal .row { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-6); }

.spin { --spin: 18px; --spin-w: 3px; display: inline-block; flex: none; width: var(--spin); height: var(--spin); border-radius: 50%;
  color: var(--brand); background: conic-gradient(from 0deg, transparent 0, currentColor 100%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--spin-w) - 1px), #000 calc(100% - var(--spin-w)));
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--spin-w) - 1px), #000 calc(100% - var(--spin-w)));
  animation: spin .85s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
@keyframes alert-in { from { opacity: 0; transform: translateY(-6px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@media (prefers-reduced-motion: reduce) {
  *:not(.spin) { transition: none !important; animation: none !important; }
}
</style>
</head>

  <symbol id="i-rot-r" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>

</svg>

<div class="app">
  <aside class="side">
    <div class="brand">
      <!-- печать Omnistra (public/img/logo.svg) одним контуром: кольцо и звезда вырезаны правилом evenodd -->
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4a3db8" fill-rule="evenodd" d="M4 24a20 20 0 1 0 40 0a20 20 0 1 0-40 0zM6.75 24a17.25 17.25 0 1 0 34.5 0a17.25 17.25 0 1 0-34.5 0zM8.25 24a15.75 15.75 0 1 0 31.5 0a15.75 15.75 0 1 0-31.5 0zM24 13A11 11 0 0 0 35 24A11 11 0 0 0 24 35A11 11 0 0 0 13 24A11 11 0 0 0 24 13Z"/></svg>
      OmnistraPDF
    </div>
    <div class="sec">Файл</div>
    <nav class="menu">
      <button data-act="open"><svg class="ico"><use href="#i-open"/></svg>Открыть PDF<span class="key">Ctrl+O</span></button>
      <button data-act="word"><svg class="ico"><use href="#i-word"/></svg>Word в PDF</button>
    </nav>
    <div class="sec">Страницы</div>
    <nav class="menu">
      <button data-act="rotL" data-doc><svg class="ico"><use href="#i-rot-l"/></svg>Повернуть влево</button>
      <button data-act="rotR" data-doc><svg class="ico"><use href="#i-rot-r"/></svg>Повернуть вправо</button>
      <button data-act="crop" data-doc id="cropBtn"><svg class="ico"><use href="#i-crop"/></svg>Обрезать</button>
      <button data-act="del" data-doc class="danger"><svg class="ico"><use href="#i-trash"/></svg>Удалить страницу<span class="key">Del</span></button>
    </nav>
    <div class="sec">Документ</div>
    <nav class="menu">
      <!-- без data-doc: без открытого документа склеивает выбранные файлы в новый, с открытым — добавляет в конец -->
      <button data-act="merge"><svg class="ico"><use href="#i-merge"/></svg>Объединить PDF</button>
      <button data-act="split" data-doc><svg class="ico"><use href="#i-split"/></svg>Разделить</button>
      <button data-act="compress" data-doc><svg class="ico"><use href="#i-shrink"/></svg>Сжать</button>
    </nav>
    <div class="side-foot">
      <div class="hint">Несколько страниц — щелчок с Ctrl или Shift. Отменить — Ctrl+Z.</div>
      <nav class="menu">
        <button data-act="update"><svg class="ico"><use href="#i-refresh"/></svg><span>Обновить</span><span class="cnt" id="updNew" hidden></span></button>
      </nav>
      <div class="ver" id="ver"></div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div style="min-width: 0">
        <h1 id="name">OmnistraPDF</h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="acts">
        <span class="busy" role="status"><span class="spin"></span><span id="busyText"></span></span>
        <button class="btn" data-act="undo" id="undo">Отменить</button>
        <button class="btn btn-primary" data-act="save" id="save">Сохранить</button>
      </div>
    </header>
    <div class="top" id="top"></div>
    <div class="work nodoc" id="work">
      <div class="thumbs" id="thumbs" aria-label="Страницы"></div>
      <div class="stage" id="stage"></div>
    </div>
  </main>
</div>

<template id="emptyTpl">
  <div class="empty">
    <h2>Откройте PDF или переведите Word-файл в PDF</h2>
    <p>Здесь появятся страницы документа.</p>
    <div class="acts">
      <button class="btn btn-primary" data-act="open">Открыть PDF</button>
      <button class="btn" data-act="word">Word в PDF</button>
      <button class="btn" data-act="merge">Объединить PDF</button>
    </div>
  </div>
</template>

<template id="cropTpl">
  <div class="cropbar">
    <div class="txt">Обведите мышью то, что нужно оставить<span class="dim" id="cropDim"></span></div>
    <button class="btn" data-act="cropCancel">Отмена</button>
    <button class="btn" data-act="cropSel" id="cropSel">Только эту страницу</button>
    <button class="btn btn-primary" data-act="cropAll" id="cropAll">Обрезать все страницы</button>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const api = () => window.pywebview.api;
const dpr = () => window.devicePixelRatio || 1;

let S = { open: false };          // состояние документа от Python
let cur = 0, sel = new Set(), anchor = 0;
let cropBox = null;               // [слева, сверху, справа, снизу] в долях страницы; null — не обрезаем
let busyN = 0, stageToken = 0;
let newVersion = null;            // версия на GitHub, если она новее этой
const thumbs = new Map(), pending = new Set();  // миниатюры по id страницы

const plural = (n, one, few, many) => {
  const a = n % 10, b = n % 100;
  return n + ' ' + (a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many);
};
const selected = () => [...sel].sort((a, b) => a - b);

/* ---------- связь с Python ---------- */
async function call(name, args = [], text = '') {
  busy(+1, text);
  try {
    const r = await api()[name](...args);
    if (r && r.error) { flash(r.error, 'danger'); return null; }
    return r;
  } catch (e) {
    flash(String(e && e.message || e), 'danger');
    return null;
  } finally {
    busy(-1);
  }
}

function busy(d, text) {
  busyN += d;
  document.body.classList.toggle('is-busy', busyN > 0);
  if (d > 0) $('#busyText').textContent = text || '';
}

function apply(st) {
  if (!st) return;
  S = st;
  const n = S.open ? S.pages.length : 0;
  if ('focus' in st) { cur = st.focus; sel = new Set([cur]); anchor = cur; }
  cur = Math.max(0, Math.min(cur, n - 1));
  sel = new Set([...sel].filter(i => i < n));
  if (!sel.size && n) sel.add(cur);
  if (!S.open) cropBox = null;
  if (st.msg) flash(st.msg, st.kind);
  draw();
}

/* ---------- отрисовка ---------- */
function draw() {
  drawHead();
  drawThumbs();
  drawTop();
  drawStage();
}

function drawHead() {
  const open = S.open;
  document.title = open ? `${S.name} — OmnistraPDF` : 'OmnistraPDF';
  $('#name').textContent = open ? S.name : 'OmnistraPDF';
  $('#ver').textContent = 'Версия ' + S.version;
  $('#updNew').textContent = newVersion || '';
  $('#updNew').hidden = !newVersion;
  $('#name').title = open ? S.path : '';
  const sub = $('#sub');
  sub.replaceChildren();
  if (open) {
    const n = S.pages.length, t = el('span');
    t.textContent = `${plural(n, 'страница', 'страницы', 'страниц')} · открыта ${cur + 1}` + (sel.size > 1 ? ` · выделено ${sel.size}` : '');
    sub.append(t);
    if (S.dirty) { const p = el('span', 'pill'); p.textContent = 'Не сохранён'; sub.append(p); }
  } else {
    sub.textContent = 'Документ не открыт';
  }
  document.querySelectorAll('[data-doc]').forEach(b => b.disabled = !open);
  $('#cropBtn').classList.toggle('on', !!cropBox);
  $('#undo').hidden = $('#save').hidden = !open;
  $('#undo').disabled = !S.canUndo || !!cropBox;
  $('#save').disabled = !!cropBox;
}

function drawThumbs() {
  const box = $('#thumbs');
  $('#work').classList.toggle('nodoc', !S.open);
  if (!S.open) { box.replaceChildren(); return; }
  const nodes = S.pages.map((p, i) => {
    const b = el('button', 'th');
    b.dataset.i = i;
    b.setAttribute('aria-label', 'Страница ' + (i + 1));
    const k = Math.min(140 / p.w, 180 / p.h);
    const img = el('img');
    img.width = Math.round(p.w * k);
    img.height = Math.round(p.h * k);
    img.alt = '';
    img.dataset.id = p.id;
    if (thumbs.has(p.id)) img.src = thumbs.get(p.id);
    const pg = el('span', 'pg'), n = el('span', 'n');
    n.textContent = i + 1;
    pg.append(img);
    b.append(pg, n);
    return b;
  });
  box.replaceChildren(...nodes);
  nodes.forEach(b => { if (!thumbs.has(+b.dataset.id)) io.observe(b); });
  markSel();
}

const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) { io.unobserve(e.target); loadThumb(e.target); }
}, { root: $('#thumbs'), rootMargin: '600px 0px' });

async function loadThumb(b) {
  const img = b.querySelector('img'), id = +img.dataset.id;
  if (thumbs.has(id) || pending.has(id)) return;
  pending.add(id);
  try {
    const url = await api().render(+b.dataset.i, id, img.width * dpr(), img.height * dpr());
    if (typeof url === 'string') {
      thumbs.set(id, url);
      document.querySelectorAll(`img[data-id="${id}"]`).forEach(x => x.src = url);
    }
  } finally {
    pending.delete(id);
  }
}

function markSel() {
  const box = $('#thumbs');
  [...box.children].forEach((b, i) => {
    b.classList.toggle('sel', sel.has(i));
    b.classList.toggle('cur', i === cur);
  });
  box.children[cur]?.scrollIntoView({ block: 'nearest' });
}

function drawTop() {
  const top = $('#top');
  let bar = top.querySelector('.cropbar');
  if (cropBox && !bar) { bar = $('#cropTpl').content.firstElementChild.cloneNode(true); top.append(bar); }
  if (!cropBox && bar) bar.remove();
  if (bar) {
    $('#cropSel').textContent = sel.size > 1 ? `Только выделенные (${sel.size})` : 'Только эту страницу';
    $('#cropSel').hidden = S.pages.length === 1;
    $('#cropAll').textContent = S.pages.length === 1 ? 'Обрезать' : 'Обрезать все страницы';
  }
}

async function drawStage() {
  const st = $('#stage');
  if (!S.open) {
    if (!st.querySelector('.empty')) st.replaceChildren($('#emptyTpl').content.firstElementChild.cloneNode(true));
    return;
  }
  const p = S.pages[cur];
  const W = st.clientWidth - 48, H = st.clientHeight - 48;
  if (W < 50 || H < 50) return;
  const k = Math.min(W / p.w, H / p.h), w = Math.round(p.w * k), h = Math.round(p.h * k);
  let page = st.querySelector('.page');
  if (!page) {
    page = el('div', 'page');
    page.append(el('img'));
    page.addEventListener('pointerdown', cropDown);
    st.replaceChildren(page);
  }
  page.style.width = w + 'px';
  page.style.height = h + 'px';
  drawCrop();
  const img = page.querySelector('img'), key = `${p.id}:${w}x${h}`;
  if (img.dataset.key === key) return;
  if (img.dataset.pid !== String(p.id)) {  // другая страница: пока рисуется крупно — миниатюра или пусто
    if (thumbs.has(p.id)) img.src = thumbs.get(p.id); else img.removeAttribute('src');
    img.dataset.pid = p.id;
  }
  const t = ++stageToken;
  const url = await api().render(cur, p.id, w * dpr(), h * dpr());
  if (t === stageToken && typeof url === 'string') { img.src = url; img.dataset.key = key; }
}

/* ---------- обрезка мышью ---------- */
function drawCrop() {
  const page = $('#stage .page');
  if (!page) return;
  let c = page.querySelector('.crop');
  page.classList.toggle('cropping', !!cropBox);
  if (!cropBox) { c?.remove(); return; }
  if (!c) {
    c = el('div', 'crop');
    for (const h of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) { const i = el('i'); i.dataset.h = h; c.append(i); }
    page.append(c);
  }
  const [l, t, r, b] = cropBox;
  const ok = r - l > .02 && b - t > .02;
  c.hidden = !ok;
  Object.assign(c.style, { left: l * 100 + '%', top: t * 100 + '%', width: (r - l) * 100 + '%', height: (b - t) * 100 + '%' });
  const p = S.pages[cur], mm = v => Math.round(v / 72 * 25.4);
  const dim = $('#cropDim');
  if (dim) dim.textContent = ok ? `${mm((r - l) * p.w)} × ${mm((b - t) * p.h)} мм` : '';
  document.querySelectorAll('#cropSel, #cropAll').forEach(x => x.disabled = !ok);
}

function cropDown(e) {
  if (!cropBox || e.button !== 0) return;
  const page = e.currentTarget, R = page.getBoundingClientRect();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const fx = x => clamp((x - R.left) / R.width, 0, 1), fy = y => clamp((y - R.top) / R.height, 0, 1);
  const h = e.target.dataset.h || (e.target.classList.contains('crop') ? 'move' : 'new');
  const start = [...cropBox], x0 = fx(e.clientX), y0 = fy(e.clientY), min = .02;
  page.setPointerCapture(e.pointerId);
  e.preventDefault();
  const move = ev => {
    const x = fx(ev.clientX), y = fy(ev.clientY);
    let [l, t, r, b] = start;
    if (h === 'new') {
      [l, r] = [Math.min(x0, x), Math.max(x0, x)];
      [t, b] = [Math.min(y0, y), Math.max(y0, y)];
    } else if (h === 'move') {
      const dx = clamp(x - x0, -l, 1 - r), dy = clamp(y - y0, -t, 1 - b);
      l += dx; r += dx; t += dy; b += dy;
    } else {
      if (h.includes('w')) l = Math.min(x, r - min);
      if (h.includes('e')) r = Math.max(x, l + min);
      if (h.includes('n')) t = Math.min(y, b - min);
      if (h.includes('s')) b = Math.max(y, t + min);
    }
    cropBox = [l, t, r, b];
    drawCrop();
  };
  const up = () => { page.removeEventListener('pointermove', move); page.removeEventListener('pointerup', up); };
  page.addEventListener('pointermove', move);
  page.addEventListener('pointerup', up);
}

/* ---------- сообщения и окна ---------- */
/* action: [подпись, функция] — кнопка в сообщении */
function flash(text, kind = 'success', action = null) {
  const top = $('#top');
  top.querySelector('.alert')?.remove();
  const a = el('div', 'alert alert-' + (kind || 'success'));
  a.setAttribute('role', kind === 'danger' ? 'alert' : 'status');
  const s = el('span'), x = el('button', 'x');
  s.textContent = text;
  x.textContent = '×';
  x.setAttribute('aria-label', 'Закрыть сообщение');
  x.onclick = () => a.remove();
  a.append(s);
  if (action) {
    const b = el('button', 'btn btn-sm');
    b.textContent = action[0];
    b.onclick = () => { if (!busyN) action[1](); };
    a.append(b);
  }
  a.append(x);
  top.prepend(a);
  setTimeout(drawStage, 0);  // сообщение сдвинуло страницу — пересчитать размер
}

/* buttons: [[значение, подпись, вид]]; «cancel» и Esc дают null, у окна с полем «ok» даёт текст поля */
function modal({ title, text, input, buttons }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const ov = el('div', 'overlay'), box = el('div', 'modal'), h = el('h3');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', title);
    h.textContent = title;
    box.append(h);
    if (text) { const p = el('p'); p.textContent = text; box.append(p); }
    let inp;
    if (input) {
      const lab = el('label'), sm = el('small');
      inp = el('input');
      inp.id = 'field';
      lab.htmlFor = 'field';
      lab.textContent = input.label;
      inp.value = input.value || '';
      sm.textContent = input.hint || '';
      box.append(lab, inp, sm);
    }
    const row = el('div', 'row');
    const done = v => { document.removeEventListener('keydown', key, true); ov.remove(); prev?.focus?.(); resolve(v); };
    for (const [v, label, kind] of buttons) {
      const b = el('button', 'btn' + (kind ? ' btn-' + kind : ''));
      b.textContent = label;
      b.onclick = () => done(v === 'cancel' ? null : v === 'ok' && inp ? inp.value : v);
      row.append(b);
    }
    box.append(row);
    ov.append(box);
    document.body.append(ov);
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
      else if (e.key === 'Enter' && inp && document.activeElement === inp) { e.preventDefault(); done(inp.value); }
      else if (e.key === 'Tab') {  // фокус не уходит под затемнение
        const f = [...box.querySelectorAll('input, button')];
        const i = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      }
      e.stopPropagation();
    };
    document.addEventListener('keydown', key, true);
    (inp || row.lastChild).focus();
  });
}

async function keepChanges() {
  if (!S.open || !S.dirty) return true;
  const a = await modal({
    title: `Сохранить изменения в «${S.name}»?`,
    buttons: [['cancel', 'Отмена'], ['discard', 'Не сохранять', 'danger'], ['save', 'Сохранить', 'primary']],
  });
  if (a === 'save') { const r = await call('save'); apply(r); return !!r; }
  return a === 'discard';
}

/* ---------- действия ---------- */
const all = () => S.pages.map((_, i) => i);
const acts = {
  async open() { if (await keepChanges()) apply(await call('open')); },
  async word() { if (await keepChanges()) apply(await call('word', [], 'Word переводит в PDF — большой документ займёт время')); },
  async merge() { apply(await call('merge', [], 'Объединение')); },
  async rotL() { apply(await call('rotate', [selected(), -90])); },
  async rotR() { apply(await call('rotate', [selected(), 90])); },
  async del() { apply(await call('delete', [selected()])); },
  crop() { cropBox = cropBox ? null : [0, 0, 0, 0]; drawHead(); drawTop(); drawStage(); },  // рамки нет, пока её не обвели
  cropCancel() { cropBox = null; drawHead(); drawTop(); drawStage(); },
  async cropAll() { await cropApply(all()); },
  async cropSel() { await cropApply(selected()); },
  async split() {
    const text = await modal({
      title: 'Разделить документ',
      input: { label: 'Страницы каждой части', hint: `Номера и диапазоны через запятую: 1-3, 4-10. Пусто — каждая страница отдельным файлом. Всего ${plural(S.pages.length, 'страница', 'страницы', 'страниц')}.` },
      buttons: [['cancel', 'Отмена'], ['ok', 'Разделить', 'primary']],
    });
    if (text !== null) apply(await call('split', [text], 'Разделение'));
  },
  async compress() { apply(await call('compress', [], 'Сжатие картинок — большой файл займёт время')); },
  async undo() { apply(await call('undo')); },
  async save() { apply(await call('save', [], 'Сохранение')); },
  async update() {
    const r = await call('update', [false], 'Проверка обновлений');
    if (!r || !r.version) return apply(r);
    if (!(await keepChanges())) return;  // обновление перезапускает программу
    const done = await call('update', [true], 'Загрузка обновления');
    if (done && done.restarting) busy(+1, 'Перезапуск'); else apply(done);
  },
};

async function checkUpdate() {
  const u = await api().check_update();
  if (!u) return;  // нет интернета или новой версии — проверим при следующем запуске
  newVersion = u.version;
  drawHead();
  flash(`Доступна новая версия OmnistraPDF: ${u.version}.`, 'info', ['Обновить', acts.update]);
}

async function cropApply(pages) {
  const r = await call('crop', [pages, cropBox]);
  if (r) { cropBox = null; apply(r); }
}

function go(i, extend = false) {
  if (!S.open) return;
  i = Math.max(0, Math.min(S.pages.length - 1, i));
  if (extend) {
    sel = new Set();
    for (let j = Math.min(anchor, i); j <= Math.max(anchor, i); j++) sel.add(j);
  } else {
    sel = new Set([i]);
    anchor = i;
  }
  cur = i;
  markSel(); drawHead(); drawTop(); drawStage();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && !busyN) acts[b.dataset.act]();
});

$('#thumbs').addEventListener('click', e => {
  const b = e.target.closest('.th');
  if (!b) return;
  const i = +b.dataset.i;
  if (e.shiftKey) return go(i, true);
  if (e.ctrlKey) {
    if (sel.has(i) && sel.size > 1) sel.delete(i); else sel.add(i);
    anchor = cur = i;
    markSel(); drawHead(); drawTop(); drawStage();
    return;
  }
  go(i);
});

let wheel = 0;
$('#stage').addEventListener('wheel', e => {
  if (!S.open) return;
  wheel += e.deltaY;
  if (Math.abs(wheel) >= 80) { go(cur + Math.sign(wheel)); wheel = 0; }
}, { passive: true });

document.addEventListener('keydown', e => {
  if (busyN || !window.pywebview || document.querySelector('.overlay')) return;
  const ctrl = e.ctrlKey || e.metaKey, n = S.open ? S.pages.length : 0;
  if (ctrl && e.code === 'KeyO') acts.open();
  else if (ctrl && e.code === 'KeyS' && S.open && !cropBox) acts.save();
  else if (ctrl && e.code === 'KeyZ' && S.canUndo && !cropBox) acts.undo();
  else if (ctrl && e.code === 'KeyA' && n) { sel = new Set(all()); markSel(); drawHead(); drawTop(); }
  else if (e.key === 'Escape' && cropBox) acts.cropCancel();
  else if (e.key === 'Delete' && n && !cropBox) acts.del();
  else if (['ArrowDown', 'ArrowRight', 'PageDown'].includes(e.key)) go(cur + 1, e.shiftKey);
  else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) go(cur - 1, e.shiftKey);
  else if (e.key === 'Home') go(0, e.shiftKey);
  else if (e.key === 'End') go(n - 1, e.shiftKey);
  else return;
  e.preventDefault();
});

let resizeTimer;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawStage, 80); }).observe($('#stage'));

window.app = { async askClose() { if (await keepChanges()) api().quit(); } };

async function init() { apply(await call('state')); checkUpdate(); }
if (window.pywebview && window.pywebview.api && window.pywebview.api.state) init();
else window.addEventListener('pywebviewready', init, { once: true });
</script>
</body>
</html>
